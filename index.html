    <!-- Global Image Error Auto-Recovery Script -->
    <script>
      window.addEventListener('error', function(e) {
        var t = e.target;
        if (t && t.tagName === 'IMG') {
          var src = t.getAttribute('src') || '';
          if (!t.dataset.recovered) {
            t.dataset.recovered = 'true';
            if (src.indexOf('nostalgia') !== -1 || src.indexOf('arcade') !== -1) {
              t.src = '/images/bada.webp';
            } else if (src.indexOf('seal') !== -1) {
              t.src = '/images/bada.webp';
            } else if (src.indexOf('davinci') !== -1) {
              t.src = '/images/davinci.jpg';
            }
          }
        }
      }, true);
    </script>
